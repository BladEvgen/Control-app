[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

extend-exclude = [
    "backend/monitoring_app/migrations",
    "backend/graphify-out",
    "backend/media",
    "frontend/graphify-out",
    "graphify-out",
    "control_image",
]

[tool.ruff.lint]
select = ["E", "W", "F", "C90"]
ignore = [
    "E265",
    "C901",
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"backend/django_settings/asgi.py" = ["E402"]
"backend/django_settings/settings.py" = ["E402"]
"backend/graph_models.py" = ["E402"]
"backend/monitoring_app/tests*.py" = ["E501"]
"backend/monitoring_app/swagger_views.py" = ["W293"]


[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    \.git
  | venv
  | node_modules
  | backend/monitoring_app/migrations
  | backend/staticroot
  | backend/out
  | graphify-out
)/
'''

[tool.pyright]
venvPath = "."
venv = "venv"
pythonVersion = "3.11"
pythonPlatform = "Linux"
include = ["backend"]
extraPaths = ["backend"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "venv",
    "backend/monitoring_app/migrations",
    "backend/staticroot",
    "backend/static",
    "backend/graphify-out",
    "backend/media",
    "backend/out",
    "backend/models",
    "control_image",
]

typeCheckingMode = "basic"

reportAttributeAccessIssue = "warning"
reportIncompatibleVariableOverride = "none"
reportUntypedFunctionDecorator = "none"
reportPrivateImportUsage = "none"
reportMissingImports = "error"
reportUndefinedVariable = "error"
reportCallIssue = "error"
reportReturnType = "error"
reportIndexIssue = "error"

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
plugins = ["mypy_django_plugin.main"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = [
    "^backend/monitoring_app/migrations/",
    "^backend/staticroot/",
    "^backend/out/",
    "^venv/",
]

[tool.django-stubs]
django_settings_module = "django_settings.settings"

# ─────────────────────────────── isort ────────────────────────────────
# Запускается вручную: isort --profile black. Секция нужна, чтобы профиль
# и ширина совпадали с black и ruff format даже без флагов в команде,
# а migrations не переписывались.
[tool.isort]
profile = "black"
line_length = 100
py_version = 311
src_paths = ["backend"]
extend_skip_glob = [
    "*/migrations/*",
    "venv/*",
    "*/node_modules/*",
    "*/staticroot/*",
    "*/graphify-out/*",
]

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "django_settings.settings"
init-hook = "import sys, os; sys.path.insert(0, os.path.join(os.getcwd(), 'backend') if os.path.isdir('backend') else os.getcwd())"
extension-pkg-allow-list = ["cv2"]
ignore = ["migrations"]
ignore-paths = [".*[\\\\/]migrations[\\\\/].*", ".*[\\\\/]venv[\\\\/].*", ".*[\\\\/]node_modules[\\\\/].*"]
ignore-patterns = ["(^|.*/)(migrations|venv|\\.venv|node_modules|build|dist|graphify-out)(/|$)"]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-branches = 20
max-statements = 90
max-locals = 25

[tool.pylint.typecheck]
generated-members = ["objects", "_default_manager", "DoesNotExist", "MultipleObjectsReturned", "_meta", "cv2.*"]
ignored-modules = ["django", "rest_framework", "channels"]

[tool.pylint.similarities]
min-similarity-lines = 999
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

[tool.pylint.reports]
score = false
reports = false

[tool.pylint."messages control"]
disable = [
    "import-error",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "ungrouped-imports",
    "logging-fstring-interpolation",
    "trailing-whitespace",
    "import-outside-toplevel",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "too-many-nested-blocks",
    "too-many-locals",
    "inconsistent-return-statements",
    "consider-using-in",
    "protected-access",
    "abstract-method",
    "invalid-name",
    "line-too-long",
    "too-many-lines",
    "wrong-import-position",
    "superfluous-parens",
    "use-maxsplit-arg",
    "consider-using-from-import",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "redefined-argument-from-local",
    "no-else-return",
    "consider-merging-isinstance",
    "super-with-arguments",
    "consider-using-min-builtin",
    "consider-using-with",
    "use-dict-literal",
    "invalid-overridden-method",
    "arguments-renamed",
    "reimported",
    "unused-variable",
    "unused-argument",
    "redefined-outer-name",
    "cell-var-from-loop",
    "raise-missing-from",
    "broad-exception-caught",
    "useless-return",
]
