{% load i18n unfold %}
{% with field=field_name|default:spec.parameter_name %}
<div class="cloc-period">
    <h3 class="font-semibold mb-2 text-font-important-light dark:text-font-important-dark">{{ title|capfirst }}</h3>
    <ul class="border border-base-200 flex flex-col rounded-default shadow-xs dark:border-base-700">
        {% for choice in choices %}
        <li class="border-b border-base-200 last:border-b-0 dark:border-base-700 {% if choice.selected %}font-semibold text-primary-600 dark:text-primary-500{% endif %}">
            <a href="{{ choice.query_string|iriencode }}" class="block px-3 py-2 hover:text-primary-600 dark:hover:text-primary-500"{% if choice.selected %} aria-current="true"{% endif %}>{{ choice.display }}</a>
        </li>
        {% endfor %}
    </ul>
    <fieldset class="cloc-period__dates mt-3 flex flex-col gap-2">
        <legend class="font-semibold mb-1 text-sm text-font-important-light dark:text-font-important-dark">Произвольный период</legend>
        <label for="id_{{ field }}_from" class="text-sm">С</label>
        <input type="date" id="id_{{ field }}_from" value="{{ spec.date_from }}" autocomplete="off" class="border border-base-200 bg-white px-3 py-2 rounded-default shadow-xs w-full dark:bg-base-900 dark:border-base-700">
        <label for="id_{{ field }}_to" class="text-sm">По</label>
        <input type="date" id="id_{{ field }}_to" value="{{ spec.date_to }}" autocomplete="off" class="border border-base-200 bg-white px-3 py-2 rounded-default shadow-xs w-full dark:bg-base-900 dark:border-base-700">
        <button type="button" id="id_{{ field }}_apply" class="cloc-period-apply bg-primary-600 font-medium px-3 py-2 rounded-default text-white w-full hover:bg-primary-600/80">Применить даты</button>
    </fieldset>
</div>
<script>
(function () {
  var fromEl = document.getElementById("id_{{ field }}_from");
  var toEl = document.getElementById("id_{{ field }}_to");
  var applyEl = document.getElementById("id_{{ field }}_apply");
  if (!fromEl || !toEl || !applyEl) return;
  function applyDates() {
    var url = new URL(window.location.href);
    url.searchParams.delete("{{ spec.parameter_name }}");
    url.searchParams.delete("p");
    if (fromEl.value) url.searchParams.set("attendance_from", fromEl.value);
    else url.searchParams.delete("attendance_from");
    if (toEl.value) url.searchParams.set("attendance_to", toEl.value);
    else url.searchParams.delete("attendance_to");
    window.location.href = url.toString();
  }
  applyEl.addEventListener("click", function (event) {
    event.preventDefault();
    applyDates();
  });
  fromEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter") applyDates();
  });
  toEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter") applyDates();
  });
})();
</script>
{% endwith %}
