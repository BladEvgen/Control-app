{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
  .object-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .reset-filters-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 32px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    color: #334155 !important;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    box-shadow: none;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .reset-filters-btn:hover {
    background: #eef2f7;
    border-color: #94a3b8;
    color: #1f2937 !important;
  }
  .reset-filters-btn:active {
    background: #e2e8f0;
  }
  @media (max-width: 768px) {
    .object-tools {
      flex-direction: column;
      align-items: stretch;
    }
    .reset-filters-btn {
      width: auto;
      justify-content: center;
    }
  }
</style>
{% endblock %}

{% block object-tools %}
<div class="object-tools">
  {{ block.super }}
  {% if request.GET %}
  <a href="{{ request.path }}" class="reset-filters-btn">
    <i class="fas fa-undo"></i>
    Сбросить фильтры
  </a>
  {% endif %}
</div>
{% endblock %}
