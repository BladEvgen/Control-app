{% extends "components/base.html" %}
{% load django_app_filters_and_tags %}
{% block title %}Вход — Staff App{% endblock %}
{% load static %}

{% block main %}
<div class="flex items-center justify-center min-h-[calc(100vh-280px)] py-10 sm:py-14 px-4">
  <div class="form-card w-full max-w-md bg-white rounded-2xl overflow-hidden border border-gray-200 shadow-card-lg animate-enter">
    <div class="bg-primary-900 px-6 py-10 sm:py-12 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/15 mb-5">
        <i class="fas fa-user-shield text-3xl text-white"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Добро пожаловать</h1>
      <p class="text-primary-100 mt-2 text-sm sm:text-base font-medium">Войдите в свой аккаунт</p>
    </div>

    <div class="p-6 sm:p-8">
      <form method="post" action="{% url 'login_view' %}" class="space-y-6">
        {% csrf_token %}
        <div>
          <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Имя пользователя</label>
          <div class="relative">
            <div class="form-icon-wrap">
              <i class="fas fa-user text-gray-400"></i>
            </div>
            <input type="text" id="username" name="username"
              class="input-field form-input-with-icon block w-full py-3.5 pl-4 pr-4 text-gray-900 placeholder-gray-400 focus:outline-none"
              placeholder="Введите логин" required autocomplete="username" autofocus />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-sm font-semibold text-gray-700">Пароль</label>
            <a href="{% url 'password_reset_request' %}" class="text-sm font-medium text-primary-600 hover:text-primary-700 transition-colors">
              Забыли пароль?
            </a>
          </div>
          <div class="relative">
            <div class="form-icon-wrap">
              <i class="fas fa-lock text-gray-400"></i>
            </div>
            <input type="password" id="password" name="password"
              class="input-field form-input-with-icon form-input-with-right-icon block w-full py-3.5 pl-4 pr-4 text-gray-900 placeholder-gray-400 focus:outline-none"
              placeholder="Введите пароль" required autocomplete="current-password" />
            <button type="button" class="password-toggle form-icon-wrap form-icon-right text-gray-400 hover:text-gray-600 transition-colors p-1.5 rounded-lg hover:bg-gray-100" aria-label="Показать/скрыть пароль">
              <i class="fas fa-eye text-lg" id="password-toggle-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary-solid btn-block py-3.5 text-base">
          <i class="fas fa-sign-in-alt"></i>
          <span>Войти</span>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var passwordInput = document.getElementById('password');
    var passwordToggle = document.querySelector('.password-toggle');
    var passwordToggleIcon = document.getElementById('password-toggle-icon');
    if (passwordToggle && passwordToggleIcon) {
      passwordToggle.addEventListener('click', function () {
        var isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        passwordToggleIcon.classList.toggle('fa-eye', !isPassword);
        passwordToggleIcon.classList.toggle('fa-eye-slash', isPassword);
      });
    }
  });
</script>
{% endblock %}
